[workspace]
resolver = "2"
members = ["core", "cli", "simulator", "benchmarks"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Concordance contributors"]

[workspace.dependencies]
blake3 = "1.5"
ed25519-dalek = { version = "2.1", features = ["serde"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1.0"
thiserror = "1.0"
