[workspace]
resolver = "2"
members = [
    "core",
    "cli",
    "simulator",
    "benchmarks",
    "adapters",
    "pilot-harness",
    "http",
    "registry-service",
    "sdk/python",
    "certification",
    "examples/standalone",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Concordance contributors"]

[workspace.dependencies]
blake3 = "1.5"
ed25519-dalek = { version = "2.1", features = ["serde"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1.0"
thiserror = "1.0"
pyo3 = { version = "0.19", features = ["extension-module", "auto-initialize"] }

# Phase 4: reference service + HTTP shim dependencies.
axum = "0.7"
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-stream = "0.1"
futures-util = "0.3"
