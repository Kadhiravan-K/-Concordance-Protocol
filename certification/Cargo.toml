[package]
name = "concordance-certification"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Concordance contributors"]

[[bin]]
name = "concordance-certify"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
concordance-adapters = { path = "../adapters" }
concordance-core = { path = "../core" }
jsonschema = "0.49.2"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3.9"
